[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2md"
version = "0.5.0a0"
description = "Local-first, provenance-aware scientific PDF reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdfium2==5.3.0",
  "Pillow==12.2.0",
]

[project.scripts]
paper2md = "paper2md.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2md = ["schemas/*.json"]
