[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwright"
version = "0.9.0a0"
description = "Local-first, provenance-aware scientific PDF reconstruction"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.14"
dependencies = [
  "pypdfium2==5.11.0",
  "Pillow==12.2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
paperwright = "paperwright.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperwright = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/paperwright/tools" = [
  "tools/run_cross_page_caption_review.py",
  "tools/run_routing_plan.py",
  "tools/run_text_review.py",
  "tools/run_text_synthesize.py",
  "tools/run_visual_review.py",
  "tools/validate_relation_dataset.py",
]
